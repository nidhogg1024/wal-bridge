name: Bug report
description: Report a defect or unexpected behavior
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve wal-bridge.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source and sink setup
      description: Share the Postgres version, slot setup, and sink type if relevant.
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Share the smallest reproduction you can.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or captured events
      description: Paste logs, event payloads, or screenshots if available.
    validations:
      required: false
